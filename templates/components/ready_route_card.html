<a
    href="/map"
    class="group block overflow-hidden rounded-[24px] bg-white shadow-soft transition duration-300 hover:-translate-y-1 hover:shadow-[0_18px_45px_rgba(0,0,0,0.12)]"
>
    <div class="h-[230px] overflow-hidden">
        <img
            src="{{ image }}"
            alt="{{ title }}"
            class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
        >
    </div>

    <div class="p-6">

        <div class="flex justify-between items-start gap-3">

            <div>

                <p class="mb-3 text-sm font-black text-[#31B8FF]">
                    [[ route.location ]]
                </p>

                <h3 class="mb-5 min-h-[56px] text-xl font-black leading-snug text-[#111827]">
                    [[ route.title ]]
                </h3>

            </div>

            <button
                v-if="isAdmin"
                @click.prevent.stop="deleteRoute(route.id)"
                class="rounded-full bg-red-500 px-3 py-2 text-sm font-bold text-white hover:bg-red-600"
            >
                🗑
            </button>

        </div>

        <div class="flex flex-wrap gap-3 text-sm">

            <span class="inline-flex items-center rounded-full bg-[#31B8FF] px-4 py-2 font-bold text-white">
                [[ route.transport ]]
            </span>

            <span class="inline-flex items-center rounded-full bg-[#F4A62A] px-4 py-2 font-bold text-white">
                [[ route.durationText ]]
            </span>

        </div>

    </div>
</a>
